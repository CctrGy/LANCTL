<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LANCTL</title><link rel="stylesheet" href="suite.css"><link rel="icon" href="../assets/launcher-icons/lanctl.svg"><link rel="stylesheet" href="app-preferences.css"><link rel="stylesheet" href="suite-settings.css"></head>
<body>
<div class="shell">
  <header><div class="brand">LAN<span>CTL</span><small><span data-i18n="LANCTL.UI.HEADING.NETWORK_CONTROL_SUITE">NETWORK CONTROL SUITE</span></small></div><span id="session-state" class="badge"><span data-i18n="LANCTL.UI.TEXT.LOCAL_SESSION">Sesión local</span></span></header>
  <div class="controls"><label><span data-i18n="LANCTL.UI.TEXT.PROJECT">Proyecto</span> <select id="project" aria-label="Proyecto activo" data-i18n-aria-label="LANCTL.UI.TEXT.ACTIVE_PROJECT"><option value="" data-i18n="LANCTL.UI.TEXT.NO_PROJECT">Sin proyecto</option></select></label><nav aria-label="Opciones generales" data-i18n-aria-label="LANCTL.UI.TEXT.GENERAL_OPTIONS"><button data-page="home" class="active"><span data-i18n="LANCTL.UI.TEXT.HOME">⌂ Inicio</span></button><button data-page="projects"><span data-i18n="LANCTL.UI.TEXT.PROJECTS_F0A63CD2">▱ Proyectos</span></button><button data-page="plugins"><span data-i18n="LANCTL.UI.HTML.PLUGINS">♧ Plugins</span></button><button data-page="settings"><span data-i18n="LANCTL.UI.TEXT.SETTINGS_B25ACB56">⚙ Configuración</span></button><button data-page="terminal"><span data-i18n="LANCTL.UI.HTML.TERMINAL">›_ Terminal</span></button></nav></div>
  <main id="content"></main>
  <p id="status" role="status" aria-live="polite"></p>
  <footer><div><span class="ready">● GUI</span><span id="version"></span><span id="project-status"><span data-i18n="LANCTL.UI.TEXT.NO_PROJECT">Sin proyecto</span></span><button id="plugin-count" data-page="plugins" data-i18n="LANCTL.UI.WORD.PLUGINS">Plugins</button><button id="external-cli" aria-label="Abrir CLI general en la terminal del sistema" data-i18n-aria-label="LANCTL.UI.TEXT.OPEN_THE_GENERAL_CLI_IN_THE_SYSTEM_TERMINAL">›_ CLI</button></div><div><button id="activity"><span data-i18n="LANCTL.UI.TEXT.ACTIVITY_1990A1A7">≡ Actividad</span></button><button id="system-info"><span data-i18n="LANCTL.UI.TEXT.SYSTEM_22FAA842">ⓘ Sistema</span></button><button data-official-link="web">Web</button><button data-official-link="github">GitHub</button><button data-official-link="reference"><span data-i18n="LANCTL.UI.TEXT.REFERENCE">Referencia</span></button></div></footer>
</div>
<dialog id="dialog"><form id="form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close-dialog" aria-label="Cerrar" data-i18n-aria-label="LANCTL.UI.TEXT.CLOSE">×</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="actions"><button type="button" id="dismiss"><span data-i18n="LANCTL.INVENTORY.MANUAL.CANCEL">Cancelar</span></button><button type="submit" class="primary" id="submit"><span data-i18n="LANCTL.UI.TEXT.SAVE">Guardar</span></button></div></form></dialog>
<dialog id="confirmation" aria-labelledby="confirmation-title" aria-describedby="confirmation-message">
<div class="dialog-head"><h2 id="confirmation-title"><span data-i18n="LANCTL.UI.TEXT.LANCTL_CONFIRMATION">LANCTL · Confirmación</span></h2></div>
<p id="confirmation-message"></p><div class="actions"><button type="button" id="confirmation-cancel" autofocus><span data-i18n="LANCTL.INVENTORY.MANUAL.CANCEL">Cancelar</span></button><button type="button" class="primary" id="confirmation-accept"><span data-i18n="LANCTL.UI.TEXT.CONTINUE">Continuar</span></button></div>
</dialog>
<script src="i18n-defaults.js"></script><script src="i18n.js"></script><script src="suite.js"></script>
<script src="suite-settings.js"></script>
<script src="app-preferences.js"></script><script src="app-support.js"></script></body></html>
