<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LANCTL</title><link rel="stylesheet" href="suite.css"><link rel="stylesheet" href="launcher-prototypes.css"><link rel="stylesheet" href="launcher.css"><link rel="icon" href="../assets/launcher-icons/lanctl.svg"><link rel="stylesheet" href="app-preferences.css"></head>
<body><div class="shell">
<header><div class="identity"><span id="brand-icon"></span><div class="brand" id="brand">LANCTL<small><span data-i18n="LANCTL.UI.TEXT.STARTING_INTERFACE">INICIANDO INTERFAZ</span></small></div></div><span class="badge" id="connection"><span data-i18n="LANCTL.UI.TEXT.CONNECTING">Conectando…</span></span></header>
<div class="controls"><span class="muted"><span data-i18n="LANCTL.UI.TEXT.PROJECT">Proyecto</span> <b id="project-heading">—</b></span><nav id="views" aria-label="Vistas de la aplicación" data-i18n-aria-label="LANCTL.UI.HTML.APPLICATION_VIEWS"></nav><button id="settings"><span data-i18n="LANCTL.UI.TEXT.SETTINGS_B25ACB56">⚙ Configuración</span></button></div>
<main id="workspace"><div class="toolbar"><div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p class="muted" id="subtitle"></p></div><div class="row" id="tools"></div></div><div class="filterbar"><input id="search" type="search" aria-label="Buscar elementos" placeholder="Buscar por nombre, identificador…" data-i18n-placeholder="LANCTL.UI.HTML.SEARCH_BY_NAME_IDENTIFIER" data-i18n-aria-label="LANCTL.UI.HTML.SEARCH_ELEMENTS"><select id="filter" aria-label="Filtrar elementos" data-i18n-aria-label="LANCTL.UI.HTML.FILTER_ELEMENTS"></select><span class="muted" id="count"></span></div><div id="canvas"><p><span data-i18n="LANCTL.UI.TEXT.CONNECTING_TO_LANCTL_SERVICES">Conectando con los servicios de LANCTL…</span></p></div></main>
<div class="commandbar"><span id="selection"><span data-i18n="LANCTL.UI.TEXT.NO_SELECTION">Sin selección</span></span><div class="row" id="commands"></div></div>
<p id="status" role="status" aria-live="polite"></p><footer><div><span class="ready"><span data-i18n="LANCTL.UI.HTML.LOCAL_GUI">● GUI local</span></span><span id="version"></span><span><span data-i18n="LANCTL.UI.TEXT.PROJECT_97E205E8">Proyecto:</span> <b id="project-name">—</b></span><button id="home">⌂ LANCTL</button><button id="cli">›_ CLI</button><button id="save"><span data-i18n="LANCTL.UI.TEXT.SAVE_PROJECT">Guardar proyecto</span></button></div><div><span id="storage" title="Almacén utilizado" data-i18n-title="LANCTL.UI.HTML.STORE_IN_USE"></span></div></footer>
