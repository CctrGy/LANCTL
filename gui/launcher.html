<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LANCTL</title><link rel="stylesheet" href="suite.css"><link rel="stylesheet" href="launcher-prototypes.css"><link rel="stylesheet" href="launcher.css"><link rel="icon" href="../assets/launcher-icons/lanctl.svg"></head>
<body><div class="shell">
<header><div class="identity"><span id="brand-icon"></span><div class="brand" id="brand">LANCTL<small>INICIANDO INTERFAZ</small></div></div><span class="badge" id="connection">Conectando…</span></header>
<div class="controls"><span class="muted">Proyecto <b id="project-name">—</b></span><nav id="views" aria-label="Vistas de la aplicación"></nav><button id="settings">⚙ Configuración</button></div>
<main id="workspace"><div class="toolbar"><div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p class="muted" id="subtitle"></p></div><div class="row" id="tools"></div></div><div class="filterbar"><input id="search" type="search" aria-label="Buscar elementos" placeholder="Buscar por nombre, identificador…"><select id="filter" aria-label="Filtrar elementos"></select><span class="muted" id="count"></span></div><div id="canvas"><p>Conectando con los servicios de LANCTL…</p></div></main>
<div class="commandbar"><span id="selection">Sin selección</span><div class="row" id="commands"></div></div>
<p id="status" role="status" aria-live="polite"></p><footer><div><span class="ready">● GUI local</span><span id="version"></span><button id="home">⌂ LANCTL</button><button id="cli">›_ CLI</button><button id="save">Guardar proyecto</button></div><div><span id="storage" title="Almacén utilizado"></span><time id="clock"></time></div></footer>
</div><dialog id="detail" aria-labelledby="detail-title"><form id="detail-form"><div class="dialog-head"><h2 id="detail-title"></h2><button type="button" id="close" aria-label="Cerrar">×</button></div><div id="detail-fields"></div><p id="detail-error" role="alert"></p><div class="actions"><button type="button" id="cancel">Cancelar</button><button type="submit" class="primary" id="submit">Guardar</button></div></form></dialog><script src="app-dialogs.js"></script><script src="launcher.js"></script><script src="wire-gui.js"></script><script src="physical-gui.js"></script></body></html>
