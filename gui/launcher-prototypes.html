<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LANCTL · Prototipos de launchers</title><link rel="stylesheet" href="suite.css"><link rel="stylesheet" href="launcher-prototypes.css"><link rel="icon" href="../assets/launcher-icons/lanwire.svg"></head>
<body><div class="shell">
<header><div class="identity"><span id="brand-icon"></span><div class="brand" id="brand"></div></div><span class="badge">Prototipo interactivo · datos de ejemplo</span></header>
<div class="controls"><label>Proyecto <select aria-label="Proyecto de ejemplo"><option>Oficina</option><option>Laboratorio</option></select></label><nav id="launchers" aria-label="Prototipos de aplicaciones"></nav><button id="settings">⚙ Configuración</button></div>
<main id="workspace"><div class="toolbar"><div><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p class="muted" id="subtitle"></p></div><div id="tools" class="row"></div></div><div class="filterbar"><input id="search" type="search" aria-label="Buscar en la aplicación" placeholder="Buscar…"><select id="filter" aria-label="Filtrar resultados"></select><span id="count" class="muted"></span></div><div id="canvas"></div></main>
<div class="commandbar"><span id="selection">Selecciona un elemento para ver sus opciones</span><div id="commands" class="row"></div></div>
<footer><div><span class="ready">● Vista de diseño</span><span id="footer-app"></span><span>Oficina · VLF de ejemplo</span><button id="home">⌂ LANCTL</button><button id="cli">›_ CLI</button></div><div><span id="feedback" role="status" aria-live="polite">Cambios solo en esta vista</span><time id="clock"></time></div></footer>
</div><dialog id="detail"><form id="detail-form"><div class="dialog-head"><h2 id="detail-title"></h2><button type="button" id="close" aria-label="Cerrar">×</button></div><div id="detail-fields"></div><div class="actions"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Aplicar al prototipo</button></div></form></dialog><script src="launcher-prototypes.js"></script></body></html>
