[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanctl"
version = "0.3.0-beta.22"
description = "CLI de control lógico y físico de infraestructuras LAN"
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6,<1",
    "manuf>=1.1.5,<2",
    "netmiko>=4.4,<5",
    "paramiko>=5.0,<6",
    "cryptography>=50.0,<51",
    "pyserial>=3.5,<4",
    "defusedxml>=0.7.1,<1",
    "rich>=14.1,<15",
]

[project.optional-dependencies]
gui = ["pywebview>=6.2.1,<7"]
dev = [
    "bandit==1.8.6",
    "coverage==7.10.6",
    "pip-audit==2.9.0",
    "pytest==9.0.3",
    "ruff==0.16.2",
]

[project.scripts]
lanctl = "lanctl.bootstrap.lanctl:main"
lanip = "lanctl.bootstrap.lanip:main"
als = "lanctl.bootstrap.lanip:main"
lanwire = "lanctl.bootstrap.lanwire:main"
lanwre = "lanctl.bootstrap.lanwire:main"
lanmon = "lanctl.bootstrap.lanmon:main"
lanrack = "lanctl.bootstrap.lanrack:main"
lanaccess = "lanctl.bootstrap.lanaccess:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lanctl*"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not legacy_gui'"
markers = [
    "legacy_gui: pruebas de la GUI congelada; ejecutar explícitamente con -m legacy_gui",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "BLE", "DTZ", "ISC", "PIE", "RUF", "SIM", "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
