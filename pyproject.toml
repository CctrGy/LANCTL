[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanctl"
version = "0.3.0-beta.20"
description = "CLI de control lógico y físico de infraestructuras LAN"
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6,<1",
    "manuf>=1.1.5,<2",
    "netmiko>=4.4,<5",
    "paramiko>=4.0,<6",
    "cryptography>=49.0,<50",
    "pyserial>=3.5,<4",
    "pywebview>=6.2.1,<7",
    "defusedxml>=0.7.1,<1",
    "rich>=14.1,<15",
]

[project.scripts]
lanctl = "app.cli:main"
als = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "BLE", "DTZ", "ISC", "PIE", "RUF", "SIM", "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
