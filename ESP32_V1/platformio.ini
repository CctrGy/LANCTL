[platformio]
# El firmware operativo debe ser siempre el objetivo implícito. El diagnóstico
# SPI solo se carga cuando se solicita expresamente con `-e enc28j60-diagnostic`.
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> -<diagnostic_enc28j60.cpp>
upload_port = COM47
monitor_port = COM47
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    ewpa/LibSSH-ESP32@^5.8.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.6
    adafruit/Adafruit NeoPixel@^1.15.1
    tobozo/ESP32-ENC28J60@1.0.1
build_flags =
    -D SSH_USERNAME=\"admin\"
    -D SSH_PASSWORD=\"1234\"
    -D SSH_PORT=22
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

[env:enc28j60-diagnostic]
extends = env:esp32-s3-devkitc-1
build_src_filter = -<*> +<diagnostic_enc28j60.cpp>
lib_deps =
