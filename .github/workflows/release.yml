name: Build release artifacts

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix
        required: true
        default: 0.3.0-beta.20

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" pyinstaller==6.21.0
      - run: python -m pip check
      - name: Tests
        run: |
          set +e
          python -m coverage run --branch --source=src -m pytest -p no:cacheprovider 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'FAIL:|ERROR:|FAILED|AssertionError|ModuleNotFoundError|AttributeError|OSError|Ran [0-9]+ tests' test-output.log | tail -10 | while IFS= read -r line; do
              echo "::error title=Test output::$line"
            done
          fi
          exit "$status"
      - name: Coverage gate
        run: |
          python -m coverage report --precision=4 --fail-under=60
          python -m coverage xml -o coverage.xml
      - name: Static correctness gate
        run: python -m ruff check .
      - name: Stable Python formatting gate
        run: python -m ruff format --check .
      - name: Error catalog gate
        run: python tools/generate_error_catalog.py --check
      - name: CLI reference gate
        run: python tools/generate_cli_reference.py --check
      - name: Security source gate
        run: python -m bandit -q -r src -ll -s B104
      - name: Dependency vulnerability gate
        # Véase docs/SECURITY.md: una API inaccesible de cryptography y la
        # compatibilidad RSA/SHA-1 desactivada en Paramiko son excepciones
        # temporales y acotadas.
        run: >-
          python -m pip_audit . --strict
          --ignore-vuln PYSEC-2026-3552
          --ignore-vuln PYSEC-2026-2858
      - run: python -m compileall -q src tests
      - run: bash -n install.sh scripts/build-linux.sh
      - run: shellcheck install.sh scripts/build-linux.sh packaging/debian/postinst packaging/debian/prerm
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with: {name: coverage-report, path: coverage.xml, if-no-files-found: error}

  windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pyinstaller==6.21.0
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Import required Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE_BASE64 -or -not $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD) {
            throw 'Windows release signing secrets are required'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'lanctl-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -LiteralPath $pfx -Force
          "LANCTL_SIGNING_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          ./scripts/build-windows.ps1 -Version $version -SigningCertificateThumbprint $env:LANCTL_SIGNING_CERTIFICATE_THUMBPRINT -RequireSignature
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/release/*
            !dist/release/SHA256SUMS.txt
            !dist/release/release-metadata.json
          if-no-files-found: error

  linux:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pyinstaller==6.21.0
      - name: Build native package
        run: |
          version="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          ./scripts/build-linux.sh "${version#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: windows-x64, path: dist/release}
      - uses: actions/download-artifact@v4
        with: {name: linux-amd64, path: dist/release}
      - uses: actions/download-artifact@v4
        with: {name: linux-arm64, path: dist/release}
      - run: cp install.ps1 install.sh dist/release/
      - run: python scripts/release-metadata.py "${GITHUB_REF_NAME#v}" "$GITHUB_SHA" dist/release
      - run: python scripts/generate-hashes.py dist/release
      - run: python scripts/verify-release.py dist/release
      - name: Optional detached signing
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            printf '%s' "$RELEASE_SIGNING_KEY" | gpg --batch --import
            gpg --batch --armor --detach-sign dist/release/SHA256SUMS.txt
          else
            echo 'No release signing key configured; publishing checksums only.'
          fi
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/release/*
