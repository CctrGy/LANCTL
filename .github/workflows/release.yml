name: Build release artifacts

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix
        required: true
        default: 0.3.0-beta.2

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pyinstaller==6.21.0
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q app tests
      - run: bash -n install.sh scripts/build-linux.sh
      - run: git diff --check

  windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pyinstaller==6.21.0
      - name: Install Inno Setup
        run: choco install innosetup --version=6.2.2 --no-progress -y
      - name: Build
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          ./scripts/build-windows.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with: {name: windows-x64, path: dist/release/*, if-no-files-found: error}

  linux:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pyinstaller==6.21.0
      - name: Build native package
        run: |
          version="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          ./scripts/build-linux.sh "${version#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dist/release, merge-multiple: true}
      - run: cp install.ps1 install.sh dist/release/
      - run: python scripts/release-metadata.py "${GITHUB_REF_NAME#v}" "$GITHUB_SHA" dist/release
      - run: python scripts/verify-release.py dist/release
      - name: Optional detached signing
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            printf '%s' "$RELEASE_SIGNING_KEY" | gpg --batch --import
            gpg --batch --armor --detach-sign dist/release/SHA256SUMS.txt
          else
            echo 'No release signing key configured; publishing checksums only.'
          fi
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/release/*
