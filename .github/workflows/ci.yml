name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gui]"
      - run: python -m pip check
      - name: Integration tests
        run: |
          set +e
          python -m coverage run --branch --source=src -m pytest -p no:cacheprovider --junitxml=pytest.xml 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'FAIL:|ERROR:|FAILED|AssertionError|ModuleNotFoundError|AttributeError|OSError|Ran [0-9]+ tests' test-output.log | tail -10 | while IFS= read -r line; do
              echo "::error title=Test output::$line"
            done
          fi
          exit "$status"
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-linux-${{ github.sha }}
          path: |
            pytest.xml
            test-output.log
          if-no-files-found: warn
          retention-days: 14
      - name: Branch coverage gate
        run: |
          python -m coverage report --precision=4 --fail-under=60
          python -m coverage xml -o coverage.xml
      - name: Static correctness
        run: python -m ruff check .
      - name: Stable Python formatting
        run: python -m ruff format --check .
      - name: Error catalog is current
        run: python tools/generate_error_catalog.py --check
      - name: CLI reference is current
        run: python tools/generate_cli_reference.py --check
      - name: Web reference is current
        run: python tools/generate_web_reference.py --check
      - name: Installer languages are current and valid
        run: python tools/generate_installer_languages.py --check
      - name: Source security
        run: python -m bandit -q -r src -ll
      - name: Repository hygiene and secret guard
        run: python tools/check_repository_hygiene.py
      - name: Dependency vulnerabilities
        run: python -m pip_audit . --strict
      - run: python -m compileall -q src tests
      - run: bash -n install.sh scripts/build-linux.sh
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  inno-source-check:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python tools/generate_installer_languages.py --check
      - run: choco install innosetup --no-progress -y
      - name: Compile wizard with inert fixtures (never install or publish)
        shell: pwsh
        run: ./scripts/check-inno.ps1

  windows-tests:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      LANCTL_GUI_BROWSER_TESTS: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,gui]"
      - name: Browser regression runtime (uses runner Microsoft Edge)
        run: python -m pip install playwright==1.63.0
      - run: python -m pip check
      - name: Native Windows regression tests
        run: python -m pytest -q -p no:cacheprovider --junitxml=pytest.xml
      - name: Preserve Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-windows-${{ matrix.python-version }}-${{ github.sha }}
          path: pytest.xml
          if-no-files-found: warn
          retention-days: 14
