name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - name: Integration tests
        run: |
          set +e
          python -m coverage run --branch --source=src -m pytest -p no:cacheprovider 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'FAIL:|ERROR:|FAILED|AssertionError|ModuleNotFoundError|AttributeError|OSError|Ran [0-9]+ tests' test-output.log | tail -10 | while IFS= read -r line; do
              echo "::error title=Test output::$line"
            done
          fi
          exit "$status"
      - name: Branch coverage gate
        run: |
          python -m coverage report --precision=4 --fail-under=60
          python -m coverage xml -o coverage.xml
      - name: Static correctness
        run: python -m ruff check .
      - name: Stable Python formatting
        run: python -m ruff format --check .
      - name: Error catalog is current
        run: python tools/generate_error_catalog.py --check
      - name: CLI reference is current
        run: python tools/generate_cli_reference.py --check
      - name: Source security
        run: python -m bandit -q -r src -ll
      - name: Repository hygiene and secret guard
        run: python tools/check_repository_hygiene.py
      - name: Dependency vulnerabilities
        # Véase docs/SECURITY.md: una API inaccesible de cryptography y la
        # compatibilidad RSA/SHA-1 desactivada en Paramiko son excepciones
        # temporales y acotadas.
        run: >-
          python -m pip_audit . --strict
          --ignore-vuln PYSEC-2026-3552
          --ignore-vuln PYSEC-2026-2858
      - run: python -m compileall -q src tests
      - run: bash -n install.sh scripts/build-linux.sh
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
